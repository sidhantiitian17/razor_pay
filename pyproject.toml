[project]
name = "razor-pay"
version = "0.1.0"
description = "Track 04 — AI Finance Controller: 3-way settlement reconciliation engine"
readme = "README.md"
authors = [
    { name = "sidhantiitian17", email = "sidhantiitian17@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "jsonschema>=4.23,<5",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",  # PYSEC-2026-1845 fixed in 9.0.3 — <9 pin excluded the fix
    "pytest-cov>=5.0,<6",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "pip-audit>=2.7,<3",
    "types-jsonschema>=4.23,<5",
    "mutmut>=2.4.4,<3",
]
llm = [
    "anthropic>=0.34,<1",
    "httpx>=0.27,<1",
]
db = [
    "supabase>=2.7,<3",
]

[project.scripts]
razor-pay = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["engine", "tests"]
# Defense in depth alongside CI's explicit `ruff check engine tests` scoping:
# ruff also lints/formats Python fenced code blocks inside Markdown. These
# docs are frozen or human-only per END_TO_END.md §3 document graph — never
# let a linter rewrite them, even if a future invocation forgets to scope
# its paths.
extend-exclude = [
    "PLAN.md",
    "PLAN_REVIEW.md",
    "IMPLEMENTATION_PLAN.md",
    "END_TO_END.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test methods document their behavior via descriptive names (testing.md
# convention) — a docstring restating "test_float_rejected rejects float"
# on every one of dozens of methods is noise, not documentation.
"tests/*" = ["D101", "D102", "D103"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.importlinter]
root_packages = ["engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core purity"
type = "forbidden"
source_modules = ["engine.core"]
forbidden_modules = [
    "engine.adapters",
    "httpx",
    "anthropic",
    "supabase",
]

[[tool.importlinter.contracts]]
name = "Grader isolation"
type = "forbidden"
source_modules = ["engine.core.grader"]
forbidden_modules = [
    "engine.core.matching",
    "engine.app.agent",
]

